stages:
- checks
- test
- deploy

pre-commit-check:
  stage: checks
  image: python:3.10-bookworm
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - pip install pre-commit
    - pre-commit run --all-files

.test:
  stage: test
  before_script:
    - apt-get update
    - apt-get install redis-server -y
    - redis-server --daemonize yes
    - python -V
    - pip install tox

test-py310-dj42:
  extends: .test
  image: python:3.10-bookworm
  script:
    - tox -e py310-django42
    - bash <(curl -s https://codecov.io/bash)

test-py310-dj52:
  extends: .test
  image: python:3.10-bookworm
  script:
    - tox -e py310-django52
    - bash <(curl -s https://codecov.io/bash)

test-py311-dj42:
  extends: .test
  image: python:3.11-bookworm
  script:
    - tox -e py311-django42
    - bash <(curl -s https://codecov.io/bash)

test-py311-dj52:
  extends: .test
  image: python:3.11-bookworm
  script:
    - tox -e py311-django52
    - bash <(curl -s https://codecov.io/bash)

test-py312-dj42:
  extends: .test
  image: python:3.12-bookworm
  script:
  - tox -e py312-django42
  - bash <(curl -s https://codecov.io/bash)

test-py312-dj52:
  extends: .test
  image: python:3.12-bookworm
  script:
  - tox -e py312-django52
  - bash <(curl -s https://codecov.io/bash)

deploy-pypi:
  stage: deploy
  image: python:3.10-bookworm

  before_script:
    - pip install build twine

  script:
    - python -m build
    - twine upload dist/*

  only:
    - tags
